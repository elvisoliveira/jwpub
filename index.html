<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open JWPUB</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <h3>Open your File :</h3>
        <div class="drag-area">
            <div class="icon">📚</div>
            <span class="header">Drag & Drop</span>
            <span class="header">or <label class="button">browse<input multiple type="file" hidden accept=".jwpub" /></label></span>
            <span class="support">Supports: JWPUB</span>
        </div>
    </div>
    <main id="reader" data-width="medium"></main>
    <div class="fabs">
        <button id="open-file" class="fab" type="button" aria-label="Open another file">+ Open</button>
        <button id="width-toggle" class="fab" type="button" aria-label="Content width: Medium">↔ Medium</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.4.0/dist/sql-asm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="jwpub.js"></script>
    <script src="ui.js"></script>
</body>

</html>
